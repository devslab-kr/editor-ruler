name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Superseded PR runs are obsolete; main/release runs retain distinct groups.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:publisher
      # Fails if any derived version reference (examples pins, README CDN
      # pins, sibling package versions) lags the core package version.
      - run: pnpm check:versions
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

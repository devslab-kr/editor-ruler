<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>editor-ruler — vanilla contenteditable example</title>
    <style>
      body { margin: 0; padding: 32px 16px; background: #f6f7f9; font-family: system-ui, sans-serif; display: flex; justify-content: center; }
      .sheet { width: min(760px, 100%); background: #fff; border: 1px solid #d8dbe0; border-radius: 10px; overflow: hidden; }
      #ruler-mount { padding: 0 40px; background: #f6f7f8; }
      #page { padding: 24px 40px 40px; min-height: 320px; outline: none; line-height: 1.6; }
      #page :is(p, h3) { margin-top: 0; }
      #page table { border-collapse: collapse; width: 100%; }
      #page td, #page th { border: 1px solid #d8dbe0; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div id="ruler-mount"></div>
      <div id="page" contenteditable="true" spellcheck="false"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
